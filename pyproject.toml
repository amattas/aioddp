[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyddp"
version = "0.1.0"
description = "Asyncio Python library for sending DDP pixel data to LED controllers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Anthony Mattas", email = "anthony@mattas.net" }
]
keywords = ["ddp", "led", "pixel", "lighting", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "mypy==2.3.0",
    "ruff==0.15.22",
    "pre-commit==4.6.0",
    "build==1.5.0",
    "bandit==1.9.4",
    # CI installs .[dev] only and the test suite imports pyddp.cli; keep in sync with [cli].
    "click==8.5.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "types-PyYAML==6.0.12.20260906",
]
cli = [
    "click==8.5.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
]
docs = [
    "zensical==0.0.50",
    "pydoc-markdown==4.8.2",
]

[project.urls]
Documentation = "https://amattas.github.io/pyddp/"
Source = "https://github.com/amattas/pyddp"

[project.scripts]
pyddp = "pyddp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyddp"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing:skip-covered --cov-report=json"

[tool.coverage.run]
source = ["src/pyddp"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
