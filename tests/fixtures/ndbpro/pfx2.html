<script>function send_control(name,val) {if (name == 'spd') {q=document.querySelectorAll('.Cspeed');q.forEach(function(e){e.value=val;});};
if (name == 'trails') {q=document.querySelectorAll('.Ctrails');q.forEach(function(e){e.value=val;});};
if (name == 'spacing') {q=document.querySelectorAll('.Cspacing');q.forEach(function(e){e.value=val;});};
if (name == 'amount') {q=document.querySelectorAll('.Camount');q.forEach(function(e){e.value=val;});};
if (name == 'dir') {q=document.querySelectorAll('.Cdir');q.forEach(function(e){e.checked=(val=='1');});};
if (name == 'rotate') {q=document.querySelectorAll('.Crotate');q.forEach(function(e){e.checked=(val=='1');});};
var xr = new XMLHttpRequest();xr.onreadystatechange=function(){if (this.readyState == 4 && this.status == 200) {re=this.responseText;}};xr.open('POST','/api/control',true);xr.send('{"'+name+'":"'+val+'"}');};var qlist = document.querySelectorAll('.Cspeed');qlist.forEach(function(e){ e.addEventListener('input',debounce(function(){send_control('spd',e.value);},100));});var qlist = document.querySelectorAll('.Ctrails');qlist.forEach(function(e){ e.addEventListener('input',debounce(function(){send_control('trails',e.value);},100));});var qlist = document.querySelectorAll('.Cspacing');qlist.forEach(function(e){ e.addEventListener('input',debounce(function(){send_control('spacing',e.value);},100));});var qlist = document.querySelectorAll('.Camount');qlist.forEach(function(e){ e.addEventListener('input',debounce(function(){send_control('amount',e.value);},100));});var qlist = document.querySelectorAll('.Cdir');qlist.forEach(function(e){ e.addEventListener('change',function(){send_control('dir',e.checked ? '1' : '0')});});var qlist = document.querySelectorAll('.Crotate');qlist.forEach(function(e){ e.addEventListener('change',function(){send_control('rotate',e.checked ? '1' : '0')});});</script>
