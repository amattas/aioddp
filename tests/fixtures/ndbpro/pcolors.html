<!DOCTYPE html><html><head><title>NDBPRO</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body,p,a,th {font-family:Arial,Sans-serif;font-size:100%;background-color:#9cc0ff;}button,input {font-family:inherit;font-size:100%;}.btable {width:80%;}td {font-family:Arial,Sans-serif;font-size:100%;text-align:center;}.button {background-color: #d0d0d0; border: 1px solid black; border-radius: 10px; color: black; padding: 4px;text-align: center; text-decoration: none; display: inline-block; font-size: 32px; margin: 4px 2px;}ul#navmenu { width: 100%; padding: 0; margin: 0 list-style-type: none; overflow: hidden; }ul#navmenu li { font-family: verdana; font-weight: bold; display: inline; float: left; border-style: solid; border-width: 1px; }ul#navmenu li a { display: inline-block; padding: 4px 12px; text-decoration: none; color: black; font-size: 16px; }ul#navmenu li a:hover { background-color: #d0d000; }input[type='color']{opacity: 0; display: block; width: 100%; height: 32px; border: none;}.bfx {border: 1px solid #1010f0;}.sel {background-color: #eeeeee;}.nsel {background-color: #8cb0e0;}.nselfx {background-color: #7094c4;}.smallbutt {width: 100%; height: 30%; background-color: #d0d0d0; padding: 2px;}.nowrap {white-space: nowrap;}.ptable {border: 1px solid black; border-collapse: collapse;}.ptable th {border: 1px solid black; background-color: #f0f0f0;}.ptable td {border: 1px solid black; background-color: #dddddd;}.ok {background-color: #40ff40;}.bad {background-color: #ff4040;}.tdef {background-color: #dddddd;}.ctable {border: 1px solid black; border-collapse: collapse;}.ctable th {border: 1px solid black; background-color: #f0f0f0;}.ctable td {border: 1px solid black; }.slbox { width: 200px; height: 40px; }.slider { -webkit-appearance: none; width: 100%; height: 15px; border-radius: 5px; background: #d3d3d3; outline: none; opacity: 0.7; -webkit-transition: .2s; transition: opacity .2s;}
.slider:hover { opacity: 1; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 25px; height: 25px; border-radius: 20%; background: #000000; cursor: pointer; }
.slider::-moz-range-thumb { width: 25px; height: 25px; border-radius: 20%; background: #000000; cursor: pointer; }
</style></head><body><ul id='navmenu'><li><a class='nsel' href="/psys.html">NDBPRO</a></li><li><a class='nsel' href="/pout.html">OUTPUTS</a></li><li><a class='nsel' href="/pnet.html">NETWORK</a></li><li><a class='sel' href="/pcolors.html">COLORS</a></li><li><a class='nselfx' href="/pfx2.html">EFFECTS</a></li><li><a class='nselfx' href="/pshows.html">SHOWS</a></li></ul><script>function setcolor(n,v,d){b = document.getElementById('bc'+n); b.style.backgroundColor = d;send_color(n,v);};function pickcolor(n){e = document.getElementById('c'+n); v=e.value;b = document.getElementById('bc'+n); b.style.backgroundColor = v;send_color(n,v); }const debounce = (func, delay) => {
let debounceTimer
return function() {
  const context = this
  const args = arguments
    clearTimeout(debounceTimer)
       debounceTimer
       = setTimeout(() => func.apply(context, args), delay)
}};
function send_control(name,val) {var xr = new XMLHttpRequest();xr.onreadystatechange=function(){if (this.readyState == 4 && this.status == 200) {re=this.responseText;}};xr.open('POST','/api/control',true);xr.send('{"'+name+'":"'+val+'"}');};function send_color(n,val) {var xr = new XMLHttpRequest();xr.onreadystatechange=function(){if (this.readyState == 4 && this.status == 200) {re=this.responseText;}};xr.open('POST','/api/control',true);xr.send('{"color":{"i":' + n + ',"c":"' + val + '"}}');};</script><div class='slbox'><label for='brightness'>Brightness </label><span id='brightval'>100%</span><input type='range' min='1' max='100' class='slider Cint' value='100'></div><p><p>Custom Color Selection:<p><table class='btable' border=1 cellspacing=1 cellpadding=10><tr>
<th>Color 1
<th>Color 2
<th>Color 3
<th>Color 4
<th>Color 5
<tr><td id='bc1' bgcolor="#be38f3"><input type='color' id='c1' onchange='pickcolor(1)'></td><td id='bc2' bgcolor="#000000"><input type='color' id='c2' onchange='pickcolor(2)'></td><td id='bc3' bgcolor="#000000"><input type='color' id='c3' onchange='pickcolor(3)'></td><td id='bc4' bgcolor="#000000"><input type='color' id='c4' onchange='pickcolor(4)'></td><td id='bc5' bgcolor="#000000"><input type='color' id='c5' onchange='pickcolor(5)'></td><tr><td><button class='smallbutt' onclick='setcolor(1,"#feffff","#ffffff")'">Cool White</button><br><button class='smallbutt' onclick='setcolor(1,"#ffffff","#c69740")'">Warm White</button><br><button class='smallbutt' onclick='setcolor(1,"#000000","#000000")'">Delete</button></td><td><button class='smallbutt' onclick='setcolor(2,"#feffff","#ffffff")'">Cool White</button><br><button class='smallbutt' onclick='setcolor(2,"#ffffff","#c69740")'">Warm White</button><br><button class='smallbutt' onclick='setcolor(2,"#000000","#000000")'">Delete</button></td><td><button class='smallbutt' onclick='setcolor(3,"#feffff","#ffffff")'">Cool White</button><br><button class='smallbutt' onclick='setcolor(3,"#ffffff","#c69740")'">Warm White</button><br><button class='smallbutt' onclick='setcolor(3,"#000000","#000000")'">Delete</button></td><td><button class='smallbutt' onclick='setcolor(4,"#feffff","#ffffff")'">Cool White</button><br><button class='smallbutt' onclick='setcolor(4,"#ffffff","#c69740")'">Warm White</button><br><button class='smallbutt' onclick='setcolor(4,"#000000","#000000")'">Delete</button></td><td><button class='smallbutt' onclick='setcolor(5,"#feffff","#ffffff")'">Cool White</button><br><button class='smallbutt' onclick='setcolor(5,"#ffffff","#c69740")'">Warm White</button><br><button class='smallbutt' onclick='setcolor(5,"#000000","#000000")'">Delete</button></td></table><p>
Delete all colors for automatic random color selection.
<p><table class='btable' border=1 cellspacing=1 cellpadding=10 style='width:16%'><tr><th>Background Color</th></tr>
<td id='bc6' bgcolor="#000000"><input type='color' id='c6' onchange='pickcolor(6)'></td><tr><td><button class='smallbutt' onclick='setcolor(6,"#000000","#000000")'">Delete</button></td></tr></table><p>
<script>var qlist = document.querySelectorAll('.Cint');qlist.forEach(function(e){ e.addEventListener('input',debounce(function(){send_control('int',e.value); document.getElementById('brightval').innerHTML = e.value + '&#37';},50)); });</script></body></html>
